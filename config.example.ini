[database]
user=YOUR_ORACLE_USER
password=YOUR_ORACLE_PASSWORD
dsn=HOST:PORT/SERVICE_NAME

[application]
default_jo_id=249
default_months=3
slot_minutes=180
hour_start=7
hour_end=22
view_name=ESK_RAPORTY.V_KOMPAS_PLAN_PRACY_KALENDARZ

[kompas_db]
engine=postgres
# Hasło może być podane przez zmienną KOMPAS_POSTGRES_DSN.
postgres_dsn=host=SERVER port=5432 dbname=kompas user=kompas_app password=CHANGE_ME
